{

mermaid.initialize({startOnLoad:false,theme:"neutral",er:{useMaxWidth:true},flowchart:{useMaxWidth:true}});
mermaid.run().then(()=>{
  document.querySelectorAll('pre.mermaid svg g.node.rootnode').forEach(g=>{g.querySelectorAll('rect,polygon,path').forEach(r=>{r.style.fill='#2f7d4f';r.style.stroke='#1d5534'});g.querySelectorAll('span,div,p,text,tspan').forEach(t=>{t.style.color='#fff';t.style.fill='#fff'})});
  document.querySelectorAll('pre.mermaid svg g[id^="entity-"]').forEach(g=>{
    const t=g.querySelector(':scope > text.entityLabel');if(!t||!ROOT_TABLES.has(t.textContent.trim()))return;
    const r=g.querySelector('rect.entityBox');if(r){r.style.fill='#2f7d4f';r.style.stroke='#1d5534'}
    t.style.fill='#fff';t.style.fontWeight='bold';
  });
  document.body.dataset.rendered='1';
});
</script>
</body></html>
