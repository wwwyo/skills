# skillctrl の CLI・CI と gh-aw engine が使う tool。CI はこの pin と mise.lock を
# trusted source（PR の base commit）から読む（.github/workflows/*.md）
[tools]
go = "1.27.3"
node = "26.13.0"
python = "3.15.2"
"go:github.com/wwwyo/skillctrl" = "3e5135a03c14828323990c44dcac29d76750bf7a"
"npm:skills" = "1.7.4"
"npm:@earendil-works/pi-coding-agent" = "1.4.0"
"github:github/gh-actions-lock" = { version = "0.4.0", bin = "gh-actions-lock" }

[settings]
lockfile = true
pin = true
minimum_release_age = "7d"
